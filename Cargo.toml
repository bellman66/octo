[package]
name = "octo"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
futures = "0.3.34"
iced = { version = "0.14.0", features = ["image-without-codecs"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"
tray-icon = "0.25.1"
ureq = { version = "3.4.2", features = ["json"] }

[build-dependencies]
resvg = "0.48.1"
winresource = "0.1.31"
