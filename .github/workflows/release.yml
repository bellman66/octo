# Windows와 macOS 실행 파일을 함께 빌드한다.
# - 태그(v*)를 푸시하면 빌드 후 GitHub Release에 올린다.
# - Actions 탭에서 직접 실행(workflow_dispatch)하면 빌드만 하고 결과는 Artifacts로 남긴다.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    env:
      # VC++ 런타임을 exe에 넣어, 런타임이 없는 PC에서도 실행되게 한다
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path target/release/octo.exe -DestinationPath dist/octo-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: octo-windows-x64
          path: dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager
      - name: Build (Apple Silicon + Intel)
        # arm64는 호스트 빌드(target/release)로 둬서, packager의 before-packaging-command가 캐시로 끝나게 한다
        run: |
          cargo build --release --locked
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/octo \
            target/release/octo \
            target/x86_64-apple-darwin/release/octo
      # 설정은 Cargo.toml [package.metadata.packager]
      - name: Package Octo.app + dmg (universal)
        run: cargo packager --release --target universal-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: octo-macos-universal
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
