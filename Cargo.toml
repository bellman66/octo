[package]
name = "octo"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
dirs = "7.0.0"
futures = "0.3.34"
iced = { version = "0.14.0", features = ["image-without-codecs"] }
keyring = { version = "3", features = ["windows-native", "apple-native"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"
tray-icon = "0.25.1"
ureq = { version = "3.4.2", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[build-dependencies]
resvg = "0.48.1"
winresource = "0.1.31"

# cargo packager --release → dist/Octo.app, dist/Octo_<ver>_<arch>.dmg
[package.metadata.packager]
product-name = "Octo"
identifier = "com.github.bellman66.octo"
before-packaging-command = "cargo build --release --locked"
out-dir = "dist"
# octo.svg에서 512px로 렌더한 것 (1024px은 packager가 icns로 변환 못 함)
icons = ["assets/octo.png"]
formats = ["app", "dmg"]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
# ad-hoc 서명: 인증서 없이도 Apple Silicon에서 실행되게
signing-identity = "-"
